spring:
  config:
    activate:
      on-profile: local
  docker:
    compose:
      enabled: true
      file: docker-compose.yaml
  datasource:
    url: jdbc:mysql://localhost:3306/heroes?allowPublicKeyRetrieval=true&sslMode=DISABLED&rewriteBatchedStatements=true
    username: heroes
    password: heroes_user
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    show-sql: true
    generate-ddl: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update

