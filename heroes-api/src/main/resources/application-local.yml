spring:
  config:
    activate:
      on-profile: local
  docker:
    compose:
      enabled: true
      file: docker-compose.yaml
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/heroes?allowPublicKeyRetrieval=true&sslMode=DISABLED&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:heroes}
    password: ${DB_PASSWORD:heroes_user}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    show-sql: true
    generate-ddl: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update

logging:
  level:
    root: INFO
    com.project.heroes: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

